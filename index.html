<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .black-header{
         background-color: black;

         display: flex;
         justify-content: space-between;

            gap: 1rem;
        }

            display:flex;
            gap: 1rem;
        }
        /* Header white */
       
        .header{
            display: flex;
            justify-content: space-between;
            background-color: aquamarine;
            padding: 1rem 8rem;
            align-items: center;
        
        }
        .logo img{
            width: 125px;
        }
        ul{
            display: flex;

            gap: 1rem;
            font-size: 14px;
        }
        a{

            color: black;
        }

            </div>

        </div>
        <div class="header">

            </div>
            <ul>
                <li><a href="">HOME</a></li>
                <li><a href="">ABOUT</a></li>
                <li><a href="">SERVICE</a></li>
                <li><a href="">PROJECTS</a></li>

                <li><a href="">CONTACT</a></li>

            </ul>

       </nav>

</html>
